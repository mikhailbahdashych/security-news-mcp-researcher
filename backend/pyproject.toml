[project]
name = "security-news-researcher"
version = "0.1.0"
description = "Local-only security news inbox, LLM research chat and meeting-notes generator."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.5",
    "anthropic>=1.5.0",
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
    "anyio>=4.0",
    "sse-starlette>=3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx2",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
