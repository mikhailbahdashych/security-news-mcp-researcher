[project]
name = "security-news-researcher"
version = "0.1.0"
description = "Local-only security news inbox, LLM research chat and meeting-notes generator."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    # >=2.3 for `NoDecode`, which is what lets CORS_ORIGINS take the
    # comma-separated form a human writes (see app/config.py).
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.5",
    "anthropic>=1.5.0",
    "feedparser>=6.0.11",
    "trafilatura>=2.0.0",
    "anyio>=4.0",
    "sse-starlette>=3.0",
    "mcp>=2.2.0,<3",
    # Runtime, not a test helper: every outbound fetch in the app (feeds,
    # articles, the URL guard, the MCP HTTP transport) is httpx2, not httpx.
    "httpx2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
